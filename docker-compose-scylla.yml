services:
  scylla:
    image: scylladb/scylla:6.2
    command: --smp 1 --memory 750M --overprovisioned 1 --api-address 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "nodetool status >/dev/null 2>&1 && nodetool status | grep -q '^UN'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    ports:
      - "9042:9042"
    volumes:
      - scylla-data:/var/lib/scylla

volumes:
  scylla-data: {}
