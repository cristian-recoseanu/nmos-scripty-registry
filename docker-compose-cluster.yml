services:
  scylla-1:
    image: scylladb/scylla:6.2
    command: --smp 1 --memory ${SCYLLA_MEMORY:-1G} --overprovisioned 1 --api-address 0.0.0.0 --seeds scylla-1
    stop_grace_period: 90s
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nodetool status >/dev/null 2>&1 && nodetool status | grep -q '^UN'"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 120s
    volumes:
      - scylla-1-data:/var/lib/scylla

  scylla-2:
    image: scylladb/scylla:6.2
    command: --smp 1 --memory ${SCYLLA_MEMORY:-1G} --overprovisioned 1 --api-address 0.0.0.0 --seeds scylla-1
    stop_grace_period: 90s
    restart: unless-stopped
    depends_on:
      scylla-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nodetool status >/dev/null 2>&1 && nodetool status | grep -q '^UN'"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 120s
    volumes:
      - scylla-2-data:/var/lib/scylla

  scylla-3:
    image: scylladb/scylla:6.2
    command: --smp 1 --memory ${SCYLLA_MEMORY:-1G} --overprovisioned 1 --api-address 0.0.0.0 --seeds scylla-1
    stop_grace_period: 90s
    restart: unless-stopped
    depends_on:
      scylla-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nodetool status >/dev/null 2>&1 && nodetool status | grep -q '^UN'"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 120s
    volumes:
      - scylla-3-data:/var/lib/scylla

  registry-1:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      scylla-1:
        condition: service_healthy
      scylla-2:
        condition: service_healthy
      scylla-3:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      SCYLLA_CONTACT_POINTS: scylla-1,scylla-2,scylla-3
      SCYLLA_LOCAL_DC: datacenter1
      SCYLLA_KEYSPACE: nmos_registry
      SCYLLA_REPLICATION_FACTOR: 3
      CHANGE_POLL_MS: 100
      HEARTBEAT_GC_INTERVAL_SECONDS: ${HEARTBEAT_GC_INTERVAL_SECONDS:-12}
      PUBLIC_HTTP_BASE: http://${EXTERNAL_HOST:-127.0.0.1}:${LB_PORT:-8080}
      PUBLIC_WS_BASE: ws://${EXTERNAL_HOST:-127.0.0.1}:${LB_PORT:-8080}
    restart: unless-stopped

  registry-2:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      scylla-1:
        condition: service_healthy
      scylla-2:
        condition: service_healthy
      scylla-3:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      SCYLLA_CONTACT_POINTS: scylla-1,scylla-2,scylla-3
      SCYLLA_LOCAL_DC: datacenter1
      SCYLLA_KEYSPACE: nmos_registry
      SCYLLA_REPLICATION_FACTOR: 3
      CHANGE_POLL_MS: 100
      HEARTBEAT_GC_INTERVAL_SECONDS: ${HEARTBEAT_GC_INTERVAL_SECONDS:-12}
      PUBLIC_HTTP_BASE: http://${EXTERNAL_HOST:-127.0.0.1}:${LB_PORT:-8080}
      PUBLIC_WS_BASE: ws://${EXTERNAL_HOST:-127.0.0.1}:${LB_PORT:-8080}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      registry-1:
        condition: service_started
      registry-2:
        condition: service_started
    ports:
      - "${LB_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx/registry-lb.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  scylla-1-data: {}
  scylla-2-data: {}
  scylla-3-data: {}
